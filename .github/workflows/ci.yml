name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      # The tests and the bundler do not launch Electron, so skip downloading its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx electron-vite build

  backend:
    name: Backend (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # CPU only: the CUDA wheels are the optional [cuda] extra and are not needed for the unit tests.
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Unit tests
        working-directory: backend
        run: pytest -m "not integration"

  site:
    name: Site (static checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html and 404.html reference only files that exist
        run: |
          set -euo pipefail
          cd site
          for f in $(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
            [ -e "$f" ] || { echo "missing: site/$f"; exit 1; }
          done
          test -f .nojekyll

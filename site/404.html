<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · WisprRam</title>
<link rel="icon" href="/wisprram/assets/favicon.png">
<style>
  :root { --bg:#F7F6F3; --text:#1C1B1A; --muted:#6B6862; --line:#ECEAE6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141312; --text:#F3F1EC; --muted:#A8A39A; --line:#2A2826; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text);
    font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight:400; font-size:clamp(48px,12vw,96px); margin:0 0 8px; line-height:1; }
  h1 em { font-style: italic; }
  p { color:var(--muted); margin:0 0 24px; font-size:18px; }
  a.btn { display:inline-block; padding:12px 20px; border-radius:12px; background:var(--text); color:var(--bg); text-decoration:none; font-weight:600; }
  a.btn:focus-visible { outline:3px solid #6366f1; outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Lost the <em>signal.</em></h1>
  <p>That page does not exist.</p>
  <a class="btn" id="home" href="https://openvibes.github.io/wisprram/">Back to WisprRam</a>
</main>
<script src="/wisprram/config.js"></script>
<script>
  // Use the configured Pages URL so the link survives a rename.
  if (window.WISPRRAM) document.getElementById('home').href = window.WISPRRAM.pagesUrl
</script>
</body>
</html>

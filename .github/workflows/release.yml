name: Release

# Push a tag like v0.2.0 (matching client/package.json) to build the installers and attach them to a DRAFT
# GitHub Release. Review the draft, then publish it. No code-signing secrets are used: the macOS app is
# ad-hoc signed (see client/electron-builder.yml) and the Windows installer is unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build only (artifacts, no release)

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION="$(node -p "require('./client/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match client/package.json version ${VERSION}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-14, args: "--mac --arm64", artifact: dist-mac }
          - { name: Windows x64, os: windows-latest, args: "--win --x64", artifact: dist-win }
          - { name: Linux x64, os: ubuntu-latest, args: "--linux --x64", artifact: dist-linux }
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx electron-vite build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: List artifacts
        run: ls -lh release/*/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            client/release/*/*.dmg
            client/release/*/*.exe
            client/release/*/*.deb
            client/release/*/*.AppImage

  release:
    name: Draft GitHub Release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -lh dist
      # Never touch a release that already exists for this tag (e.g. one published by hand with
      # locally built installers): updating it could flip it back to draft or replace its assets.
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged (artifacts are attached to this run)."
          fi
      - if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage

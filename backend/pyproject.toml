[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wisprram-server"
version = "0.2.0"
description = "Self-hosted Wispr Flow-style dictation backend (faster-whisper + Ollama)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic>=2.6",
  "faster-whisper>=1.1.0",
  "numpy",
  "av>=14,<17",  # faster-whisper 1.2 passes metadata_errors=, removed in PyAV 17+
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/OpenVibes/wisprram"

[project.optional-dependencies]
# NVIDIA GPU users on Linux: the CUDA 12 runtime libs CTranslate2 needs (~1.5 GB).
# scripts/run.sh puts them on LD_LIBRARY_PATH automatically. Skip on CPU-only machines and in CI.
cuda = [
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12==9.*",
]
dev = ["pytest>=8"]

[project.scripts]
wisprram-server = "wisprram_server.cli:main"

[tool.setuptools.packages.find]
include = ["wisprram_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs GPU/model/Ollama (real audio)"]
